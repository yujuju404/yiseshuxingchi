<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>洛克王国·世界 异色属性池查询</title>
<style>
:root{--bg:#0e1626;--panel:#16233c;--panel2:#1c2c4a;--line:#2a3c60;
  --txt:#e8eef7;--mut:#93a5c4;--ac:#ffd34d;--shiny:#ff9ff3;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:radial-gradient(1200px 600px at 20% -10%,#1d3a63 0%,var(--bg) 55%);
  color:var(--txt);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;min-height:100vh;}
.wrap{max-width:1100px;margin:0 auto;padding:24px 18px 60px;}
header{text-align:center;padding:26px 0 18px;}
header h1{font-size:26px;letter-spacing:2px;color:#fff;text-shadow:0 0 18px rgba(90,202,248,.35);}
header p{color:var(--mut);margin-top:6px;font-size:13px;}
.badge{display:inline-block;margin-top:12px;padding:4px 14px;border-radius:999px;
  background:rgba(90,202,248,.12);border:1px solid rgba(90,202,248,.35);color:var(--ac);font-size:13px;}
.tabs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0 22px;}
.tab{padding:9px 22px;border-radius:999px;border:1px solid var(--line);background:var(--panel);
  color:var(--mut);cursor:pointer;font-size:14px;transition:.2s;}
.tab.active{background:linear-gradient(90deg,#3b6cff,#5ac8fa);color:#fff;border-color:transparent;
  box-shadow:0 6px 18px rgba(90,202,248,.35);}
.ctrl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.ctrl label{color:var(--mut);}
select{padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);
  color:var(--txt);font-size:14px;cursor:pointer;}
.panel-title{font-size:15px;font-weight:700;color:#fff;margin:20px 0 12px;
  display:flex;align-items:center;gap:8px;}
.cnt{font-size:12px;color:var(--mut);font-weight:400;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px;}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:10px;text-align:center;transition:.2s;}
.card:hover{transform:translateY(-3px);border-color:#3b6cff;}
.card img{width:84px;height:84px;object-fit:contain;background:var(--panel);border-radius:8px;margin:4px auto;}
.card .nm{font-size:13px;margin-top:6px;min-height:17px;line-height:1.3;}
.card .sub{font-size:11px;color:var(--ac);margin-top:3px;min-height:14px;}
.tag{position:absolute;top:6px;left:6px;font-size:11px;padding:2px 8px;border-radius:999px;
  background:rgba(255,159,243,.16);color:var(--shiny);border:1px solid rgba(255,159,243,.4);}
.chips{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;margin-top:6px;}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:2px 8px;border-radius:8px;
  background:rgba(90,202,248,.14);color:var(--txt);border:1px solid rgba(90,202,248,.3);line-height:18px;}
.chip .aicon{width:15px;height:15px;flex:none;}
.chip.shiny{background:rgba(255,159,243,.15);color:var(--shiny);border:1px solid rgba(255,159,243,.35);}
.specrow{display:flex;justify-content:center;margin-top:5px;}
.spec{font-size:11px;padding:2px 9px;border-radius:10px;line-height:1.4;}
.spec.red{color:#ff5f5f;background:rgba(255,95,95,.13);border:1px solid rgba(255,95,95,.42);}
.spec.gold{color:var(--ac);background:rgba(255,211,77,.12);border:1px solid rgba(255,211,77,.4);}
.selcard{grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px;max-width:280px;}
.star-block{margin-bottom:18px;}
.star-title{font-size:14px;font-weight:700;color:#fff;margin:0 0 10px;
  display:flex;align-items:center;gap:8px;}
.empty{color:var(--mut);text-align:center;padding:26px 0;}
</style>
</head>

<div class="wrap">

    <div class="empty" id="eRel" style="display:none"></div>

    <div class="grid" id="gSame"></div>
    <div class="empty" id="eSame" style="display:none"></div>
  </section>

  <!-- 功能③ 本赛季异色 -->
  <section id="t3" style="display:none">
    <div id="gSlots"></div>
  </section>
</div>

const D = DATA;
const ATTRS = D.attrs;
const ATTRSET = {};
ATTRS.forEach(function(a){ ATTRSET[a]=1; });

function fill(sel, opts, first){
  var s = document.getElementById(sel);
  var h = "";
  (first||[]).forEach(function(o){ h+='<option value="'+o+'">'+o+'</option>'; });
  opts.forEach(function(o){ h+='<option value="'+o+'">'+o+'</option>'; });
  s.innerHTML = h;
}
function chips(arr, extra){
  var h = "";
  (arr||[]).forEach(function(c){
    if(c && c !== "0") h += '<span class="chip'+(extra||"")+'"><img class="aicon" src="'+(D.aicons[c]||'')+'">'+c+'</span>';
  });
  return h ? '<div class="chips">'+h+'</div>' : "";
}
function specCls(s){ return s.indexOf("赤月-攻击")>=0 ? "red" : (s.indexOf("金月-状态")>=0 ? "gold" : ""); }
function card(x, type){
  var tag = (type==="rec") ? '' : '<span class="tag">异色</span>';
  var body = (type==="rec")
      ? '<div class="sub">星光 '+(x.s)+'</div>'+chips([x.a1,x.a2])
      : '<div class="sub">'+x.sea+'</div>'+chips([x.a1,x.a2]," shiny")
        + (x.spec? '<div class="specrow"><span class="spec '+specCls(x.spec)+'">'+x.spec+'</span></div>' : '');
  return '<div class="card">'+tag+'<img src="'+x.img+'"><div class="nm">'+x.n+'</div>'+body+'</div>';
}
function renderGrid(id, list, type){
  var g = document.getElementById(id);
  g.innerHTML = list.map(function(x){ return card(x, type); }).join("");
  g.style.display = list.length ? "grid" : "none";
}

document.getElementById("stageFilt").value = "终阶";

var FT = {}; D.termSeq.forEach(function(q){ FT[q] = 1; });

function renderRel(list){
  var box = document.getElementById("gRel");
  var stars = [];
  list.forEach(function(x){ if(stars.indexOf(x.s)<0) stars.push(x.s); });
  stars.sort(function(a,b){ return b-a; });
  box.innerHTML = stars.map(function(st){
    var items = list.filter(function(x){ return x.s===st; });
    return '<div class="star-block"><div class="star-title">星光 '+st+' <span class="cnt">'+items.length+' 只</span></div><div class="grid">'+items.map(function(x){return card(x,"rec");}).join("")+'</div></div>';
  }).join("");
  box.style.display = list.length ? "block" : "none";
  document.getElementById("eRel").style.display = list.length ? "none" : "block";
}

function runT1(){

  var px = D.shiny.filter(function(x){ return x.sea===sea && (x.a1===a || x.a2===a); });
  document.getElementById("cX").textContent = px.length ? " "+px.length+" 只" : "";
  renderGrid("gX", px, "shy");
  document.getElementById("eX").style.display = px.length ? "none" : "block";
  document.getElementById("eX").textContent = "暂无符合条件的异色精灵";
  var pool = D.rec.filter(function(x){ return x.a1===a; });
  var seen = {};
  pool = pool.filter(function(x){
    if(x.s<=0) return false;
    if(seen[x.q]) return false;
    seen[x.q]=1; return true;
  });
  if(stage !== "全部"){
    var set = stage==="初阶" ? F1 : FT;
    pool = pool.filter(function(x){ return !!set[x.q]; });
  }
  renderRel(pool);
}
document.getElementById("attrFilt").addEventListener("change", runT1);
document.getElementById("seaFilt1").addEventListener("change", runT1);
document.getElementById("stageFilt").addEventListener("change", runT1);

// --- 功能② 能歪谁 ---
var seaSel = document.getElementById("seaSel");
var shySel = document.getElementById("shySel");
function runT2(){
  var sea = seaSel.value;
  var sname = shySel.value;
  var sel = null;
  D.shiny.forEach(function(x){ if(x.n===sname) sel=x; });
  var hd = document.getElementById("selDetail");
  if(sel){
    hd.innerHTML = '<div class="panel-title">你选择的异色</div><div class="grid selcard">'+card(sel,"shy")+'</div>';
  } else hd.innerHTML = "";
  var pa = sel ? a1v(sel) : "";
  var same = D.shiny.filter(function(x){
    return x.n!==sname && (!sea || x.sea===sea) && pa && (x.a1===pa || x.a2===pa);
  });
  document.getElementById("cC").textContent = " " + same.length + " 只";
  renderGrid("gSame", same, "shy");
  document.getElementById("eSame").style.display = same.length ? "none" : "block";
  document.getElementById("eSame").textContent = (sel) ? "没有同赛季同属性的其他异色" : "请先选择异色精灵";
}
seaSel.addEventListener("change", runT2);
shySel.addEventListener("change", runT2);

// --- 功能③ 本赛季异色 ---
function renderT3(){
  var box = document.getElementById("gSlots");
  var groups = {}, none = 0;
  D.shiny.forEach(function(x){ if(x.spec){ (groups[x.spec]=groups[x.spec]||[]).push(x); } else none++; });
  var html = "";
  Object.keys(groups).sort().forEach(function(sp){
    html += '<div class="star-block"><div class="star-title">'+sp+' <span class="cnt">'+groups[sp].length+' 只</span></div><div class="grid">'+groups[sp].map(function(x){return card(x,"shy");}).join("")+'</div></div>';
  });
  if(none){
    var un = D.shiny.filter(function(x){ return !x.spec; });
    html += '<div class="star-block"><div class="star-title">未分类 <span class="cnt">'+none+' 只</span></div><div class="grid">'+un.map(function(x){return card(x,"shy");}).join("")+'</div></div>';
  }
  box.innerHTML = html;
  box.style.display = "block";
}

// --- tabs ---
document.querySelectorAll(".tab").forEach(function(btn){
  btn.addEventListener("click", function(){
    document.querySelectorAll(".tab").forEach(function(b){ b.classList.remove("active"); });
    btn.classList.add("active");
    ["t1","t2","t3"].forEach(function(id){ document.getElementById(id).style.display = (id===btn.dataset.t) ? "block" : "none"; });
  });
});

runT1(); runT2(); renderT3();
</script>
